apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: concourse
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://concourse-charts.storage.googleapis.com/
      chart: concourse
      targetRevision: 18.2.0
      helm:
        valueFiles:
          - $values/gitops/apps/concourse/values.yaml

    - repoURL: https://github.com/mpvdev/eks-concourse
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: concourse

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true